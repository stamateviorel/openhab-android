name: Test APK

on:
  push:
    branches:
      - test-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: gradle

      - name: Use fixed debug key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build
        run: ./gradlew :mobile:assembleFossBetaDebug

      - uses: actions/upload-artifact@v4
        with:
          name: openhab-foss-beta-debug
          path: mobile/build/outputs/apk/fossBeta/debug/*.apk
