name: Test APK

on:
  push:
    branches:
      - test-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: gradle

      - name: Use fixed debug key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          env | grep -E '^(ANDROID|HOME=)' | sort
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            for dir in "$HOME/.android" "$ANDROID_USER_HOME" "${ANDROID_SDK_HOME:+$ANDROID_SDK_HOME/.android}" "${ANDROID_PREFS_ROOT:+$ANDROID_PREFS_ROOT/.android}"; do
              [ -n "$dir" ] || continue
              mkdir -p "$dir"
              echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
              ls -la "$dir/debug.keystore"
            done
          fi

      - name: Build
        run: ./gradlew :mobile:assembleFossBetaDebug

      - name: Show signing key
        run: |
          find / -name debug.keystore -not -path "/proc/*" 2>/dev/null | xargs -r ls -la
          keytool -printcert -jarfile mobile/build/outputs/apk/fossBeta/debug/*.apk | grep -E "Valid from|SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: openhab-foss-beta-debug
          path: mobile/build/outputs/apk/fossBeta/debug/*.apk
