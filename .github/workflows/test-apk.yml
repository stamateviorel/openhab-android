name: Test APK

on:
  push:
    branches:
      - test-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: gradle

      - name: Use fixed debug key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          # AGP resolves the .android folder below XDG_CONFIG_HOME on the runners
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            for dir in "$HOME/.android" "${XDG_CONFIG_HOME:-$HOME/.config}/.android"; do
              mkdir -p "$dir"
              echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
            done
          fi

      - name: Build
        run: ./gradlew :mobile:assembleFossBetaDebug

      - name: Show signing key
        run: |
          keytool -printcert -jarfile mobile/build/outputs/apk/fossBeta/debug/*.apk | grep -E "Valid from|SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: openhab-foss-beta-debug
          path: mobile/build/outputs/apk/fossBeta/debug/*.apk
